name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow for animated profile GIFs
        run: python -m pip install Pillow

      - name: Install dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Fetch contribution data
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: Arpit248-3

      - name: Render the refined hero, tagline, section headings, and activity chart
        run: python scripts/render_profile_visuals.py

      - name: Render annual contribution heatmap
        run: python scripts/generate_streak_svg.py Arpit248-3 contrib-heatmap.svg

      - name: Render statistics dashboard
        run: python scripts/render_stats_svg.py

      - name: Apply scoped animation and light-theme fixes
        run: python scripts/fix_profile_animation_scope.py --assets-only

      - name: Generate looping leadership, skills and activity chart GIFs
        run: python scripts/generate_profile_animation_assets.py --assets-only

      - name: Commit refreshed profile visuals
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile visuals [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg contrib-heatmap-light.svg stats.svg stats-light.svg activity-graph.svg activity-graph-light.svg profile-ascii.svg profile-ascii-light.svg assets/*.svg assets/animated/*.gif"
