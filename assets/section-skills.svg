<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="72" viewBox="0 0 1100 72" role="img" aria-labelledby="title">
<title id="title">03 — TECHNICAL SKILLS</title>
<defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A78BFA" stop-opacity=".20"/><stop offset=".55" stop-color="#0E1B2D" stop-opacity=".96"/><stop offset="1" stop-color="#10243B"/></linearGradient><linearGradient id="beam"><stop offset="0" stop-color="#A78BFA" stop-opacity="0"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs>
<style>
 .card{opacity:1;transform:translateX(0);animation:slide .72s cubic-bezier(.2,.8,.2,1) 0.24s both}
 .beam{stroke-dasharray:260;stroke-dashoffset:260;animation:draw 1.45s ease-out 0.46s forwards}
 .dot{animation:blink 2.8s ease-in-out 0.24s infinite}
 @keyframes slide{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}
 @keyframes draw{to{stroke-dashoffset:0}}
 @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.card{opacity:1;transform:none;animation:none}.beam{stroke-dashoffset:0;animation:none}.dot{animation:none;opacity:1}}
</style>
<g class="card">
 <rect x="2" y="2" width="1096" height="68" rx="13" fill="url(#panel)" stroke="#29415A" stroke-opacity=".95"/>
 <rect x="2" y="2" width="6" height="68" rx="3" fill="#A78BFA"/>
 <text x="33" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#A78BFA" letter-spacing="2">03</text>
 <text x="88" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="750" fill="#E6F1FF" letter-spacing="1.2">TECHNICAL SKILLS</text>
 <path d="M87 57 H1060" stroke="#29415A" stroke-width="1.2"/>
 <path class="beam" d="M87 57 H350" stroke="url(#beam)" stroke-width="2.8" stroke-linecap="round"/>
 <circle class="dot" cx="1060" cy="36" r="5" fill="#A78BFA"/>
 <circle cx="1060" cy="36" r="10" fill="none" stroke="#A78BFA" stroke-opacity=".32"/>
</g>
</svg>