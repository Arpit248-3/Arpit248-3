<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="76" viewBox="0 0 1200 76" role="img" aria-labelledby="title">
<title id="title">02 — CONTRIBUTIONS</title>
<defs>
 <linearGradient id="sectionLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity=".95"/><stop offset=".55" stop-color="#22D3EE" stop-opacity=".72"/><stop offset="1" stop-color="#A78BFA" stop-opacity=".05"/></linearGradient>
 <filter id="tinyGlow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
 .titleGroup{animation:reveal .72s cubic-bezier(.2,.8,.2,1) .06s}
 .rule{stroke-dasharray:920;stroke-dashoffset:0;animation:draw 1.45s cubic-bezier(.2,.8,.2,1) .2s}
 .pulse{animation:pulse 2.8s ease-in-out infinite}
 @keyframes reveal{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
 @keyframes draw{from{stroke-dashoffset:920}to{stroke-dashoffset:0}}
 @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
 @media (prefers-reduced-motion:reduce){.titleGroup{opacity:1;transform:none;animation:none}.rule{stroke-dashoffset:0;animation:none}.pulse{animation:none;opacity:.8}}
</style>
<g class="titleGroup">
 <text x="10" y="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#22D3EE" letter-spacing="1.5">02</text>
 <g transform="translate(62 17)" stroke="#22D3EE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#tinyGlow)"><path d="M3 19V5M3 19H21M5 15l4-4 4 2 6-7"/><circle cx="19" cy="6" r="1.5"/></g>
 <text x="105" y="44" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#E6F1FF" letter-spacing=".8">CONTRIBUTIONS</text>
 <path d="M105 60 H1180" stroke="#29415A" stroke-width="1.1" stroke-opacity=".9"/>
 <path class="rule" d="M105 60 H450" stroke="url(#sectionLine)" stroke-width="2.4" stroke-linecap="round" filter="url(#tinyGlow)" fill="none"/>
 <circle class="pulse" cx="1180" cy="60" r="2.8" fill="#22D3EE"/>
</g>
</svg>