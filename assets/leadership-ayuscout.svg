<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Arpit Jham — Leadership Experience: AI for Bharat Hackathon 2026</title>
  <desc id="desc">Animated teal and violet leadership visual for team lead of AyuScout AI, a pharmacovigilance intelligence platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1424"/>
      <stop offset="0.56" stop-color="#101c30"/>
      <stop offset="1" stop-color="#0b2430"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.56" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="348" rx="22"/></clipPath>
  </defs>
  <style>
    .eyebrow{font:600 13px 'SFMono-Regular',Consolas,monospace;letter-spacing:2.6px;fill:#67e8f9}
    .micro{font:500 11px 'SFMono-Regular',Consolas,monospace;letter-spacing:1.2px;fill:#8da6c5}
    .heading{font:700 37px 'Segoe UI',Arial,sans-serif;letter-spacing:.2px;fill:url(#titleFill)}
    .project{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#dbeafe}
    .body{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a9bdd5}
    .chip{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#cbd5e1}
    .flow{stroke-dasharray:5 10;animation:flow 12s linear infinite}
    .pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .pulse2{animation:pulse 2.6s ease-in-out infinite .8s;transform-box:fill-box;transform-origin:center}
    .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes flow{to{stroke-dashoffset:-180}}
    @keyframes pulse{0%,100%{opacity:.52;transform:scale(.88)}50%{opacity:1;transform:scale(1.18)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse,.pulse2,.float{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="350" rx="22" fill="url(#bg)"/>
    <ellipse cx="170" cy="176" rx="220" ry="210" fill="url(#halo)"/>
    <ellipse cx="1130" cy="20" rx="220" ry="180" fill="url(#halo)" opacity=".45"/>
    <path d="M0 296 C180 242 280 334 470 292 S790 250 970 292 S1120 322 1200 282" fill="none" stroke="#164e63" stroke-width="1" opacity=".5"/>
    <path d="M0 309 C180 255 280 347 470 305 S790 263 970 305 S1120 335 1200 295" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".64" class="flow"/>
    <rect x="18" y="18" width="1164" height="314" rx="18" fill="none" stroke="#29425c" stroke-width="1"/>
    <g transform="translate(74 44)">
      <text class="eyebrow" x="0" y="0">LEADERSHIP / 01</text>
      <text class="micro" x="0" y="22">PRODUCT DIRECTION · TEAM DELIVERY</text>
      <g transform="translate(116 135)" class="float">
        <circle r="94" fill="none" stroke="#1e3a52" stroke-width="1"/>
        <circle r="76" fill="none" stroke="#28516a" stroke-width="1" stroke-dasharray="2 8"/>
        <circle r="54" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity=".65"/>
        <path d="M-54 -23 L-15 -45 L30 -25 L50 14 L14 46 L-33 28 Z" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity=".72"/>
        <path d="M-54 -23 L14 46 M-15 -45 L-33 28 M30 -25 L-33 28 M-15 -45 L50 14" fill="none" stroke="#6484a8" stroke-width="1" opacity=".68"/>
        <circle cx="-54" cy="-23" r="5" fill="#2dd4bf" class="pulse" filter="url(#softGlow)"/>
        <circle cx="-15" cy="-45" r="4" fill="#38bdf8" class="pulse2"/>
        <circle cx="30" cy="-25" r="5" fill="#a78bfa" class="pulse"/>
        <circle cx="50" cy="14" r="4" fill="#38bdf8" class="pulse2"/>
        <circle cx="14" cy="46" r="5" fill="#2dd4bf" class="pulse"/>
        <circle cx="-33" cy="28" r="4" fill="#a78bfa" class="pulse2"/>
        <circle r="25" fill="#0c2032" stroke="url(#accent)" stroke-width="1.6"/>
        <path d="M-11 2 L-3 -8 L3 -1 L12 -13" fill="none" stroke="#a5f3fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle r="37" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".22" class="pulse"/>
      </g>
      <text class="micro" x="0" y="284">SAFETY SIGNALS · PRIVACY · REGULATORY REPORTING</text>
    </g>
    <g transform="translate(355 56)">
      <rect x="0" y="-24" width="138" height="27" rx="13.5" fill="#102a3c" stroke="#1d6471"/>
      <circle cx="15" cy="-10.5" r="4" fill="#2dd4bf" class="pulse"/>
      <text x="27" y="-6" class="chip" fill="#99f6e4">TEAM LEAD</text>
      <text class="heading" x="0" y="52">AI for Bharat</text>
      <text class="heading" x="0" y="96">Hackathon 2026</text>
      <text class="project" x="1" y="133">AyuScout AI</text>
      <text class="body" x="1" y="161">Pharmacovigilance intelligence platform</text>
      <text class="body" x="1" y="185">Safety-signal review · Patient-data protection</text>
      <text class="body" x="1" y="209">Regulatory reporting in one workflow</text>
      <path d="M0 237 H716" stroke="#29425c" stroke-width="1"/>
      <path d="M0 237 H192" stroke="url(#accent)" stroke-width="2.4" class="flow"/>
      <text class="eyebrow" x="0" y="265">BUILDING SAFER, MORE RELIABLE WORKFLOWS</text>
      <g transform="translate(680 -9)">
        <circle cx="0" cy="0" r="3" fill="#2dd4bf" class="pulse" filter="url(#softGlow)"/>
        <circle cx="22" cy="16" r="2.5" fill="#a78bfa" class="pulse2"/>
        <circle cx="-18" cy="24" r="2" fill="#38bdf8" class="pulse"/>
      </g>
    </g>
    <rect x="1" y="1" width="1198" height="348" rx="22" fill="none" stroke="#2e4968" stroke-width="1.4"/>
  </g>
</svg>
