<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">AI for Bharat Hackathon 2026 — AyuScout AI leadership</title>
<desc id="desc">Animated teal and violet leadership graphic with a dedicated network illustration on the left and a clear, separate text area on the right.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A1322"/><stop offset="0.56" stop-color="#102237"/><stop offset="1" stop-color="#0B2631"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2DD4BF"/><stop offset="0.48" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#A5F3FC"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
 <radialGradient id="halo"><stop offset="0" stop-color="#2DD4BF" stop-opacity=".19"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
 <ellipse cx="145" cy="150" rx="185" ry="180" fill="url(#halo)"/>
 <ellipse cx="1120" cy="12" rx="230" ry="160" fill="url(#halo)" opacity=".42"/>
 <rect x="18" y="18" width="1164" height="264" rx="18" fill="none" stroke="#29425C"/>
 <path d="M0 254 C175 213 298 285 455 252 S745 223 900 253 S1090 282 1200 236" fill="none" stroke="#164E63" stroke-width="1" opacity=".8"/>
 <path d="M0 267 C175 226 298 298 455 265 S745 236 900 266 S1090 295 1200 249" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity=".7" stroke-dasharray="5 10"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="10s" repeatCount="indefinite"/></path>
 <!-- Dedicated illustration lane: the node graphic ends before the text starts. -->
 <g transform="translate(142 151)">
  <circle r="92" fill="none" stroke="#21425A"/>
  <circle r="64" fill="none" stroke="url(#accent)" stroke-width="1.1" stroke-dasharray="5 9" opacity=".62">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="37" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0">
   <animate attributeName="r" values="30;78;91" dur="4.2s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values=".62;.25;0" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="43" fill="none" stroke="#A78BFA" stroke-width="1" stroke-dasharray="2 7" opacity=".55">
   <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="23s" repeatCount="indefinite"/>
  </circle>
  <circle r="73" fill="none" stroke="#28516A" stroke-dasharray="2 8"/>
  <circle r="52" fill="none" stroke="url(#accent)" stroke-width="1.2" opacity=".72"/>
  <path d="M-50 -22 L-13 -43 L29 -25 L49 13 L12 43 L-32 27 Z" fill="none" stroke="#2DD4BF" stroke-width="1.4" opacity=".82"/>
  <path d="M-50 -22 L12 43 M-13 -43 L-32 27 M29 -25 L-32 27 M-13 -43 L49 13" fill="none" stroke="#6484A8" stroke-width="1" opacity=".72"/>
  <circle cx="-50" cy="-22" r="5" fill="#2DD4BF" filter="url(#glow)"><animate attributeName="opacity" values=".42;1;.42" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="-13" cy="-43" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="29" cy="-25" r="5" fill="#A78BFA"><animate attributeName="opacity" values=".45;1;.45" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="49" cy="13" r="4" fill="#38BDF8"><animate attributeName="opacity" values="1;.4;1" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="12" cy="43" r="5" fill="#2DD4BF"><animate attributeName="opacity" values=".42;1;.42" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="-32" cy="27" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;.4;1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle r="25" fill="#0C2032" stroke="url(#accent)" stroke-width="1.6"/>
  <circle r="29" fill="none" stroke="#67E8F9" stroke-width="1" opacity=".55">
   <animate attributeName="r" values="26;34;26" dur="3.2s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values=".2;.75;.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <path d="M-11 2 L-3 -8 L3 -1 L12 -13" fill="none" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle r="3.2" fill="#F8FAFC" filter="url(#glow)">
   <animateMotion path="M-50 -22 L-13 -43 L29 -25 L49 13 L12 43 L-32 27 Z" dur="5.8s" repeatCount="indefinite"/>
   <animate attributeName="opacity" values=".25;1;.25" dur="5.8s" repeatCount="indefinite"/>
  </circle>
 </g>
 <!-- Each text row starts slightly dim and left-shifted, then brightens/slides into place in sequence. -->
 <g transform="translate(-8 0)" opacity=".82">
  <animateTransform attributeName="transform" type="translate" values="-8 0;0 0;0 0;-8 0" keyTimes="0;0.08;0.88;1" begin="0.15s" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.08;0.88;1" begin="0.15s" dur="10s" repeatCount="indefinite"/>
  <rect x="323" y="36" width="128" height="27" rx="13.5" fill="#102A3C" stroke="#1D6471"/>
  <circle cx="338" cy="49.5" r="4" fill="#2DD4BF"><animate attributeName="opacity" values=".45;1;.45" dur="2.5s" repeatCount="indefinite"/></circle>
  <text x="351" y="54" font-family="Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.8" fill="#67E8F9">TEAM LEAD</text>
 </g>
 <g transform="translate(-8 0)" opacity=".82">
  <animateTransform attributeName="transform" type="translate" values="-8 0;0 0;0 0;-8 0" keyTimes="0;0.08;0.88;1" begin="0.55s" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.08;0.88;1" begin="0.55s" dur="10s" repeatCount="indefinite"/>
  <text x="323" y="101" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="700" fill="url(#headline)">AI for Bharat Hackathon 2026
   <animate attributeName="opacity" values="1;.88;1" dur="4.4s" repeatCount="indefinite"/>
  </text>
 </g>
 <g transform="translate(-8 0)" opacity=".82">
  <animateTransform attributeName="transform" type="translate" values="-8 0;0 0;0 0;-8 0" keyTimes="0;0.08;0.88;1" begin="1.0s" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.08;0.88;1" begin="1.0s" dur="10s" repeatCount="indefinite"/>
  <text x="324" y="137" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="650" fill="#E0F2FE">AyuScout AI</text>
 </g>
 <g transform="translate(-8 0)" opacity=".82">
  <animateTransform attributeName="transform" type="translate" values="-8 0;0 0;0 0;-8 0" keyTimes="0;0.08;0.88;1" begin="1.4s" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.08;0.88;1" begin="1.4s" dur="10s" repeatCount="indefinite"/>
  <text x="324" y="169" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#A9BDD5">Pharmacovigilance intelligence platform</text>
 </g>
 <g transform="translate(-8 0)" opacity=".82">
  <animateTransform attributeName="transform" type="translate" values="-8 0;0 0;0 0;-8 0" keyTimes="0;0.08;0.88;1" begin="1.8s" dur="10s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.22;1;1;0.22" keyTimes="0;0.08;0.88;1" begin="1.8s" dur="10s" repeatCount="indefinite"/>
  <text x="324" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#A9BDD5">Safety-signal review · Patient-data protection · Regulatory reporting</text>
 </g>
 <path d="M323 226 H1138" stroke="#29425C" stroke-width="1"/>
 <path d="M323 226 H510" stroke="url(#accent)" stroke-width="2.2" stroke-dasharray="5 10"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="10s" repeatCount="indefinite"/></path>
 <path d="M323 226 H1138" stroke="#38BDF8" stroke-width="1.4" opacity=".28" stroke-dasharray="2 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="7.5s" repeatCount="indefinite"/>
 </path>
 <circle cy="21" r="2.5" fill="#67E8F9" filter="url(#glow)">
  <animate attributeName="cx" values="30;1170;30" dur="9s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".2;1;.2" dur="4.5s" repeatCount="indefinite"/>
 </circle>
 <g transform="translate(1107 43)"><circle r="3" fill="#2DD4BF" filter="url(#glow)"><animate attributeName="opacity" values=".4;1;.4" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="22" cy="16" r="2.5" fill="#A78BFA"><animate attributeName="opacity" values="1;.3;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="-18" cy="24" r="2" fill="#38BDF8"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle></g>
 <rect x="1" y="1" width="1198" height="298" rx="22" fill="none" stroke="#2E4968" stroke-width="1.4"/>
</g>
<circle id="loop-spark-injected" cx="24" cy="240.0" r="3.0" fill="#22D3EE"><animateMotion dur="6s" repeatCount="indefinite" path="M 20,240.0 L 1180.0,240.0"/><animate attributeName="r" values="2.2;4.0;2.2" dur="2.5s" repeatCount="indefinite"/></circle></svg>