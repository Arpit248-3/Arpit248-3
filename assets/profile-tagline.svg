<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="64" viewBox="0 0 1200 64" role="img" aria-labelledby="title">
<title id="title">Engineering reliable AI products, designing clear interfaces, leading teams to delivery</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60A5FA"/><stop offset=".52" stop-color="#22D3EE"/><stop offset="1" stop-color="#2DD4BF"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<style>
  .caption{font-family:'JetBrains Mono',Consolas,monospace;font-size:19px;font-weight:700;letter-spacing:.35px;fill:url(#g)}
  .sweep{animation:sweep 4.8s ease-in-out infinite}
